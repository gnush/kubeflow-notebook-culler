---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-notebook-culler-cr
rules:
- apiGroups: ["kubeflow.org"]
  resources: ["notebooks"]
  verbs: ["list", "get", "patch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-notebook-culler-crb
subjects:
- kind: ServiceAccount
  name: kubeflow-notebook-culler-sa
  namespace: kubeflow
roleRef:
  kind: ClusterRole
  name: kubeflow-notebook-culler-cr
  apiGroup: rbac.authorization.k8s.io
