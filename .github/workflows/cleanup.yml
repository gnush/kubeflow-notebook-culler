name: cleanup

on:
  schedule:
    - cron: "27 4 13 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: kubeflow-notebook-culler
          package-type: container
          min-versions-to-keep: 5
          # ignore everything but sha-*
          ignore-versions: "^(?!sha-).*$"
